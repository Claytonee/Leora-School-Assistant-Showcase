<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Tenant isolation: one codebase and one database serving separated schools, with cross-tenant reads blocked at the data-access layer"><!--(c) 2026 Claytone Curthberth Mhina - Leora Tech Solutions. All rights reserved.-->
